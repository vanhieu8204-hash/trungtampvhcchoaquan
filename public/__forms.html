<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Biểu mẫu Trung tâm Phục vụ Hành chính công xã Hoa Quân</title>
</head>
<body>
  <!-- Netlify Form: Phản ánh kiến nghị & Đánh giá mức độ hài lòng -->
  <form name="citizen_feedback" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="citizen_feedback" />
    <input name="bot-field" />
    <input name="citizenName" />
    <input name="phone" />
    <input name="email" />
    <input name="address" />
    <input name="topic" />
    <input name="satisfactionRating" />
    <textarea name="content"></textarea>
  </form>

  <!-- Netlify Form: Đặt lịch hẹn làm việc trực tuyến tại Bộ phận một cửa -->
  <form name="appointment_booking" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="appointment_booking" />
    <input name="bot-field" />
    <input name="citizenName" />
    <input name="phone" />
    <input name="idCardNumber" />
    <input name="serviceType" />
    <input name="appointmentDate" />
    <input name="appointmentTimeSlot" />
    <textarea name="notes"></textarea>
  </form>
</body>
</html>
